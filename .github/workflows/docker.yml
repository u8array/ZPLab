name: Docker

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/docker.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/*/package.json
  # A main build seeds the layer cache a release run can read.
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/docker.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/*/package.json
  release:
    types: [published]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # GitHub's pre-release flag only guards the desktop updater, so a plain semver tag still gets latest.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/u8array/zplab
          tags: type=semver,pattern={{version}}

      - uses: docker/login-action@v3
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          # Both arches only for the push, because a pull request just proves the build.
          platforms: ${{ github.event_name == 'release' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
