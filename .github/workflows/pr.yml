name: CI

on:
  # dependabot-attribution.yml dispatches this, since its token push starts no run.
  workflow_dispatch:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main, prod]

permissions:
  contents: read

jobs:
  # The prod ruleset requires the check context lint-test-build / gates, so neither job name may change.
  lint-test-build:
    uses: ./.github/workflows/gates.yml
