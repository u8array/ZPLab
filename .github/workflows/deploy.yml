name: Deploy to GitHub Pages

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gates:
    uses: ./.github/workflows/gates.yml
    with:
      upload-dist: true

  deploy:
    needs: gates
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

      - uses: actions/deploy-pages@v5
        id: deployment
