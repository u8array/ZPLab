# The static designer and the server as two services. Export ZPLAB_TOKEN, then:
#   docker compose -f compose.example.yml up
# The designer on 8787 prints through the server and reads the printer's answer. The static designer on 8080 has no such path.
services:
  zplab:
    image: ghcr.io/u8array/zplab:latest
    ports:
      - "8080:8080"
  zplab-server:
    image: ghcr.io/u8array/zplab-server:latest
    environment:
      ZPLAB_TOKEN: ${ZPLAB_TOKEN:?export ZPLAB_TOKEN first}
      # ZPLAB_PRINTERS: '[{"id":"dock","name":"Dock 3","host":"10.0.0.5"}]'
    # The token travels in plain text, so only loopback without a TLS proxy in front.
    ports:
      - "127.0.0.1:8787:8787"
